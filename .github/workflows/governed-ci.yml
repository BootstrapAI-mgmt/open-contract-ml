name: Governed CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-checks:
    name: Governed Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run 4-Pillar Governed Lightweight Validator (PR Adversarial Diff + Firewall)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mode="impl"
          if echo "$PR_TITLE" | grep -qiE '^\[spec\]|^docs\(spec\):'; then
            mode="spec"
          elif echo "$PR_LABELS" | grep -qi 'gov-attested'; then
            mode="governance"
            export LW_OPERATOR_ATTESTATION="human-approved"
          fi
          tc_ids="$(echo "$PR_TITLE" | grep -oE 'TC-[A-Z0-9-]+' | paste -sd, - || true)"
          node tools/governed/check-governed.mjs --diff-base "$BASE_SHA" --mode "$mode" --require-non-empty-diff --tc "$tc_ids"
      - name: Run 4-Pillar Governed Lightweight Validator (Main Branch State)
        if: github.event_name != 'pull_request'
        run: node tools/governed/check-governed.mjs
      - name: Run Test Suite (Non-Vacuous Floor Enforced)
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test-out.txt"
          if ! grep -qE '^(#|ℹ) tests [1-9][0-9]*$' "$RUNNER_TEMP/test-out.txt" || grep -qE '^(#|ℹ) tests 0$' "$RUNNER_TEMP/test-out.txt"; then
            echo "::error title=vacuous-tests::Test runner executed 0 tests (FIND-302 guard)"
            exit 1
          fi
      - name: Verify All Task Card Acceptance Criteria Parse & Classify Cleanly
        run: npm run check:criteria

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install & Run Pinned Gitleaks on Event Commit Range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks"
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts="$range" --redact --no-banner --no-color .
