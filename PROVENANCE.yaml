# PROVENANCE.yaml -- where every file in this repository comes from.
# Read by tests/test_provenance.py; see `what_this_is`.
schema_version: 2
repo: open-contract-ml
what_this_is: 'One record per tracked file, in one of three classes. `authored`: written for this package.
  `extracted`: carried over from the maintainer''s earlier work on these tools; `transformed` says whether
  the file was edited for publication. `modified_copies`: a file of another producer''s package, copied
  in as a test fixture; `copy_of` names the package and `changes` says how the copy differs, which the
  package''s README repeats file by file. Every record says why the file is here and pins its sha256 (this
  file''s own record excepted). tests/test_provenance.py fails if a file has no record, if a record names
  a file that is not here, or if a committed file no longer matches its recorded digest. The public history
  of this repository starts at a single snapshot; earlier development history is retained privately.'
