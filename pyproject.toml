[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-contract-ml"
version = "0.1.0"
description = "The Contract v1: a model-card / manifest / provenance / validation standard for engineering ML, and the checker that enforces it."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "BootstrapAI-mgmt" }]
keywords = ["model-card", "manifest", "provenance", "validation", "surrogate", "cae"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# The validation library is the core: it is what a consumer installs to decide
# whether a package conforms. The conformance checker (opencontractml.verify)
# is deliberately standard-library-only and needs none of these -- see README.
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The corpus/model gate engine. Separated because a consumer validating a
# package does not need a training stack to do it.
gate = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3"]
# Tensor-checkpoint safe loading (opencontractml.safeload).
tensors = ["torch>=2.0", "safetensors>=0.4"]
dev = ["pytest>=8.0", "build>=1.0", "open-contract-ml[gate]"]

[project.scripts]
open-contract-ml = "opencontractml.verify:main"

[project.urls]
Homepage = "https://github.com/BootstrapAI-mgmt/open-contract-ml"
Specification = "https://github.com/BootstrapAI-mgmt/open-contract-ml/blob/main/docs/spec/CONTRACT-v1.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The schemas and the card template travel *inside* the wheel: one resolution
# path (importlib.resources), identical in a source tree, a wheel and a frozen
# exe, with no PyInstaller `sys._MEIPASS` special case.
opencontractml = ["schemas/**/*.json", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test *this* checkout's src/, not whatever `opencontractml` happens to be
# installed. Measured, not hypothetical: with a user-level editable install of a
# second checkout on sys.path, `python -m pytest` in this tree imported that
# other tree's verify.py, so a before/after comparison ran against files nobody
# had edited and reported green. pytest prepends these entries to sys.path, so
# the working tree wins over site-packages.
#
# This does not weaken the installed-package check: tests/test_verify.py still
# resolves the schemas through
# `importlib.resources`, which finds them under src/ here and inside the wheel
# once installed. CI exercises the installed path separately -- the `package`
# job in .github/workflows/ci.yml runs the checker from outside the checkout.
pythonpath = ["src"]
