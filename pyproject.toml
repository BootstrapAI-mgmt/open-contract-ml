[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-contract-ml"
version = "0.1.0"
description = "The Contract v1: a model-card / manifest / provenance / validation standard for engineering ML, and the checker that enforces it."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "BootstrapAI-mgmt" }]
keywords = ["model-card", "manifest", "provenance", "validation", "surrogate", "cae"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# The validation library is the core: it is what a consumer installs to decide
# whether a package conforms. The conformance checker (opencontractml.verify)
# is deliberately standard-library-only and needs none of these -- see README.
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The corpus/model gate engine. Separated because a consumer validating a
# package does not need a training stack to do it.
gate = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3"]
# Tensor-checkpoint safe loading (opencontractml.safeload).
tensors = ["torch>=2.0", "safetensors>=0.4"]
dev = ["pytest>=8.0", "build>=1.0", "open-contract-ml[gate]"]

[project.scripts]
open-contract-ml = "opencontractml.verify:main"

[project.urls]
Homepage = "https://github.com/BootstrapAI-mgmt/open-contract-ml"
Specification = "https://github.com/BootstrapAI-mgmt/open-contract-ml/blob/main/docs/spec/CONTRACT-v1.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The schemas and the card template travel *inside* the wheel. This is what
# replaced cae-ml-gui's `resource_path` / PyInstaller `sys._MEIPASS` lookup:
# one resolution path, identical in a source tree, a wheel and a frozen exe.
opencontractml = ["schemas/**/*.json", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
