spec_version: "1.0"
id: "plate_heat_fno"
name: "Plate Heat Field Surrogate -- Fourier Neural Operator"
version: "1.0.0"
owner:
  team: "not recorded in this fixture copy (see README.md)"
  contact: "not recorded in this fixture copy (see README.md)"
domain: "steady_conduction_heat_transfer"
modality: "field_in_field_out"
analysis_type: "steady-state 2-D conduction with convective loss"
tags:
  - "contract-v1"
  - "grid"
  - "fno"
purpose: "Predicts the steady-state temperature-rise field of a convectively-cooled plate from its conductivity map, heat sources, convection coefficient and thickness, with a split-conformal band, so that a design sweep can be run without a finite-volume solve per candidate."
when_to_use: "Screening and ranking plate layouts inside the declared input ranges, where a field plus a stated uncertainty band is enough and a full solve per candidate is too slow."
when_not_to_use: "Any engineering decision taken without a licensed engineer in the loop; transient, conjugate or radiative problems; geometry, grid or boundary conventions other than the one this corpus was generated with."
inputs:
  - name: "k0_W_mK"
    type: "float"
    units: "W/(m K)"
    required: true
    description: "Base-plate thermal conductivity. The corpus draws this log-uniformly across the steel-to-aluminium span."
    range:
      - 15.0
      - 220.0
  - name: "h_W_m2K"
    type: "float"
    units: "W/(m^2 K)"
    required: true
    description: "Convective heat transfer coefficient on the plate faces."
    range:
      - 15.0
      - 300.0
  - name: "t_m"
    type: "float"
    units: "m"
    required: true
    description: "Plate thickness. Enters the convective loss term per unit area."
    range:
      - 0.001
      - 0.006
  - name: "source_P_W"
    type: "float"
    units: "W"
    required: true
    description: "Total power of the heat source."
    range:
      - 2.0
      - 25.0
  - name: "source_sigma_m"
    type: "float"
    units: "m"
    required: true
    description: "Gaussian standard deviation of the heat source footprint."
    range:
      - 0.004
      - 0.012
  - name: "source_xc_m"
    type: "float"
    units: "m"
    required: true
    description: "Source centre, x. Measured from the Dirichlet edge."
    range:
      - 0.015
      - 0.095
  - name: "source_yc_m"
    type: "float"
    units: "m"
    required: true
    description: "Source centre, y."
    range:
      - 0.005000000000000001
      - 0.095
  - name: "design_json"
    type: "string"
    required: false
    description: "Advanced escape hatch: a JSON-encoded full design object ({k0, h, t, inserts[], sources[]}) as produced by the producer's design sampler. When present it supersedes every scalar above, which is how multi-source plates and conductivity inserts stay reachable -- Contract v1 has no list-of-object input type to declare them with."
outputs:
  - name: "dT"
    type: "field"
    units: "K"
    viewer: "field_contour"
    description: "Steady-state temperature rise above the ambient T_inf, one value per grid cell, row-major (ny, nx). The shape and the coordinate reference are carried in provenance.dataset.grid and in the entrypoint's response rather than here: Contract v1's outputs[] vocabulary has no field shape or coordinate-reference key (CONTRACT-v1.md section 10, limitation 3)."
primary_inputs:
  - "k0_W_mK"
  - "h_W_m2K"
  - "source_P_W"
primary_outputs:
  - "dT"
uncertainty:
  form: "predictive_interval"
  per_output:
    dT:
      lower_field: "dT_lower"
      upper_field: "dT_upper"
      level: 0.9
      half_width_K: 6.540130615234375
      method: "split conformal on the per-sample worst-cell absolute error; one scalar half-width for the whole field, not a per-cell interval"
  calibration:
    n_cal: 255
    empirical_coverage: 0.9176470588235294
    method: "calibration split disjoint from train, val and test; coverage measured on the interior test split"
